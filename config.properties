# UTF-8. Пути указывайте через /, например C:/Study/Projects.
# Относительные пути считаются от папки этого файла.
# Несколько значений в списке разделяются точкой с запятой.
quarantineDirectory=data/quarantine
stateFile=data/state.properties
logFile=data/application.log
historyFile=data/history.tsv
reportFile=data/report.txt
defaultProfile=safe
defaultRetentionDays=14
maximumScanDepth=30
askAboutExpiredOnStartup=true
followSymbolicLinks=false
logFullPaths=false

# Точки можно добавлять и менять через меню.
roots=demo
root.demo.name=Учебный пример
root.demo.path=demo
root.demo.profile=full
root.demo.depth=30
root.demo.enabled=true
root.demo.exclusions=

profiles=safe;development;downloads;editors;full
profile.safe.categories=build-output;test-results
profile.development.categories=build-output;dependency-cache;test-results;editor-temporary
profile.downloads.categories=incomplete-download
profile.editors.categories=editor-temporary
profile.full.categories=build-output;dependency-cache;test-results;editor-temporary;incomplete-download
# Необязательные настройки профиля:
# profile.full.rules=scala-target
# profile.full.excludedRules=local-cache
# profile.full.retentionDays=20
# profile.full.maximumSize=1073741824

rules=scala-target;dotnet-build;web-build;local-cache;test-results;editor-temp;downloads

rule.scala-target.name=Результаты сборки Scala
rule.scala-target.description=Каталог target рядом с build.sbt или pom.xml
rule.scala-target.category=build-output
rule.scala-target.type=directory
rule.scala-target.exactName=target
rule.scala-target.parentContains=build.sbt;pom.xml
rule.scala-target.retentionDays=7
rule.scala-target.priority=100

rule.dotnet-build.name=Результаты сборки .NET
rule.dotnet-build.description=bin или obj рядом с файлом проекта
rule.dotnet-build.category=build-output
rule.dotnet-build.type=directory
rule.dotnet-build.patterns=bin;obj
rule.dotnet-build.parentContains=*.csproj;*.fsproj
rule.dotnet-build.retentionDays=7
rule.dotnet-build.priority=100

rule.web-build.name=Результаты сборки веб-проекта
rule.web-build.description=build или dist рядом с package.json
rule.web-build.category=build-output
rule.web-build.type=directory
rule.web-build.patterns=build;dist
rule.web-build.parentContains=package.json
rule.web-build.retentionDays=14
rule.web-build.priority=90

rule.local-cache.name=Явно разрешённый локальный кэш
rule.local-cache.description=Папка .cache рядом с маркером .allow-clean-cache
rule.local-cache.category=dependency-cache
rule.local-cache.type=directory
rule.local-cache.exactName=.cache
rule.local-cache.parentContains=.allow-clean-cache
rule.local-cache.retentionDays=14
rule.local-cache.priority=80

rule.test-results.name=Отчёты тестов
rule.test-results.description=Каталог отчётов рядом с файлом проекта
rule.test-results.category=test-results
rule.test-results.type=directory
rule.test-results.patterns=coverage;test-results
rule.test-results.parentContains=package.json;build.sbt;pom.xml;*.csproj
rule.test-results.retentionDays=14
rule.test-results.priority=70

rule.editor-temp.name=Временные файлы редактора
rule.editor-temp.description=Временный файл не моложе суток
rule.editor-temp.category=editor-temporary
rule.editor-temp.type=file
rule.editor-temp.patterns=*.tmp;*.swp;*~
rule.editor-temp.minimumAgeHours=24
rule.editor-temp.retentionDays=14
rule.editor-temp.priority=50

rule.downloads.name=Старые незавершённые загрузки
rule.downloads.description=Недокачанный файл не моложе трёх суток
rule.downloads.category=incomplete-download
rule.downloads.type=file
rule.downloads.patterns=*.part;*.crdownload
rule.downloads.minimumAgeHours=72
rule.downloads.retentionDays=7
rule.downloads.priority=50

exclusions=git;fixtures;keep
globalExclusions=git;fixtures;keep
exclusion.git.kind=name
exclusion.git.value=.git
exclusion.fixtures.kind=mask
exclusion.fixtures.value=**/fixtures/**
exclusion.keep.kind=mask
exclusion.keep.value=*.keep.tmp
